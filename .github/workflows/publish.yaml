- name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install marimo
        run: uv pip install --system marimo

      - name: Export notebook to WASM HTML
        run: |
          mkdir -p dist
          marimo export html-wasm synopsis.py --output dist/index.html --mode run
